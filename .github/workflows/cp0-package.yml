name: cp0 package

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: cp0-package-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build cp0 package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure ARM64 package source
        run: |
          sudo dpkg --add-architecture arm64

          if ! grep -q '^Architectures:' /etc/apt/sources.list.d/ubuntu.sources; then
            sudo sed -i '/^Components:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi

          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            dpkg-dev \
            g++-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            git \
            python3-venv \
            zlib1g-dev \
            zlib1g:arm64

      - name: Bootstrap third-party dependencies
        run: ./bootstrap.sh

      - name: Calculate build version
        id: version
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${CURRENT_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
            latest_version="${latest_tag#v}"

            if [[ "${latest_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
            else
              major=0
              minor=0
              patch=0
            fi

            version="${major}.${minor}.$((patch + 1))"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Build version: ${version}"

      - name: Run unit tests
        run: |
          cmake -S . -B build/tests \
            -DKEYBOARD_GUIDE_USE_SDL=OFF \
            -DKEYBOARD_GUIDE_BUILD_TESTS=ON \
            -DKEYBOARD_GUIDE_VERSION=${{ steps.version.outputs.version }}
          cmake --build build/tests --parallel 2 --target \
            keyboard_guide_modifier_state_tests
          ctest --test-dir build/tests --output-on-failure

      - name: Build cp0 package
        env:
          KEYBOARD_GUIDE_VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/deb/package_deb.sh

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp dist/M5CardputerZero-Keyboard-Guide release-assets/
          cp dist/*.deb release-assets/
          ls -lh release-assets

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cp0-package
          path: release-assets/*
          if-no-files-found: error

  upload-release-assets:
    name: Upload Debian package to GitHub Release
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: cp0-package
          path: release-assets

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Keyboard Guide $RELEASE_TAG" \
              --notes "Automated release for $RELEASE_TAG"
          fi

          gh release upload "$RELEASE_TAG" release-assets/*.deb --clobber
